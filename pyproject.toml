[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "release-train-conductor"
version = "0.1.0"
description = "Runs a scheduled release train end to end from one manifest, with a human gate at every step that needs judgment."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "pyyaml>=6.0", "ruamel.yaml>=0.18"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.setuptools.package-data]
conductor = ["repos.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
